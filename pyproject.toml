[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tragedy-sim"
version = "0.2.0"
description = "Deterministic local FS/BTX game with abilities, incidents, loops and victory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tragedy-sim = "tragedy_sim.cli:main"

[tool.setuptools.packages.find]
include = ["tragedy_sim*"]
