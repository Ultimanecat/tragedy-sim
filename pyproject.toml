[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tragedy-sim"
version = "0.8.0"
description = "Deterministic Tragedy Looper simulator with CLI, hotseat GUI and JSON service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tragedy-sim = "tragedy_sim.cli:main"
tragedy-sim-server = "tragedy_sim.server:main"

[project.gui-scripts]
tragedy-sim-gui = "tragedy_sim.cli:gui_main"

[tool.setuptools.packages.find]
include = ["tragedy_sim*"]

[tool.setuptools.package-data]
tragedy_sim = ["locales/*.json"]
