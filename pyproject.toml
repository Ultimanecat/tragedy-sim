[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tragedy-sim"
version = "0.1.0"
description = "FS/BTX action-card simulator: stage one, without abilities or incidents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tragedy-sim = "tragedy_sim.cli:main"

[tool.setuptools.packages.find]
include = ["tragedy_sim*"]
