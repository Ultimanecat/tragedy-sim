[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tragedy-sim"
version = "0.5.0"
description = "Local FS/BTX/OF simulator with CLI and native hotseat GUI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tragedy-sim = "tragedy_sim.cli:main"

[project.gui-scripts]
tragedy-sim-gui = "tragedy_sim.cli:gui_main"

[tool.setuptools.packages.find]
include = ["tragedy_sim*"]
