# Optional domain endpoint alongside the IP endpoint.
# Install as /etc/nginx/conf.d/tragedy-domain.conf, then use Certbot's
# Nginx plugin to add TLS and HTTP-to-HTTPS redirection for this hostname.
# This file must be included within nginx's http context.
limit_req_zone $binary_remote_addr zone=tragedy_domain_requests:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tragedy_domain_create:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=tragedy_domain_connections:10m;

server {
    listen 80;
    server_name tragedy.niegu.top;

    client_max_body_size 1m;
    limit_req_status 429;
    limit_req zone=tragedy_domain_requests burst=30 nodelay;
    limit_conn tragedy_domain_connections 20;

    location ^~ /v1/games {
        return 403;
    }

    location = /v1/rooms {
        limit_req zone=tragedy_domain_create burst=2 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
