# Temporary port-80 site for Certbot's IP-address HTTP-01 challenge.
# Install as /etc/nginx/conf.d/tragedy-sim.conf, then replace with
# nginx-tragedy.conf after the certificate has been issued.
server {
    listen 80;
    server_name 47.93.184.53;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tragedy-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
